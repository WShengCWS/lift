<script>
/* apply theme and glass before first paint, so there is no flash */
try { var s = JSON.parse(localStorage.getItem('lift2_settings') || 'null') || {};
  document.documentElement.dataset.theme = s.theme || 'device';
  if (s.reduceGlass) document.documentElement.classList.add('noglass');
  if (s.textSize === 'large') document.documentElement.classList.add('big');
} catch (e) {}
</script>
